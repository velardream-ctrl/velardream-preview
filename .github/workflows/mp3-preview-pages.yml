name: MP3 converter test preview

on:
  push:
    branches:
      - test/mp3-converter-20261122
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: velardream-preview-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Verify MP3 conversion page
        run: |
          test -s mp3-converter.html
          grep -q 'new window.lamejs.Mp3Encoder' mp3-converter.html
          grep -q 'decodeAudioData' mp3-converter.html
          if grep -Eiq 'firebase|firestore|cloudflare' mp3-converter.html; then
            echo 'MP3 converter must not access site services' >&2
            exit 1
          fi
      - name: Prepare preview without git and workflows
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' ./ _site/
          touch _site/.nojekyll
      - name: Configure test repository Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
