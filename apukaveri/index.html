*{box-sizing:border-box}body{--ink:#243c35;--muted:#5f6e66;--brand:#176a54;--bg:#f6f8f2;--soft:#e3efdf;--card:#fff;--accent:#f6d9ac;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}body.modern{--ink:#142b45;--muted:#536881;--brand:#285eb2;--bg:#f0f5ff;--soft:#dfeaff;--accent:#d5e4ff}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;background:var(--brand);color:white;font-weight:650}button.secondary{background:var(--soft);color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #bf7620;outline-offset:3px}header,main,footer{max-width:1180px;margin:auto;padding:18px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{font-weight:850;font-size:25px;color:var(--brand);letter-spacing:-1px}.logo span{display:inline-grid;place-items:center;background:var(--soft);border-radius:13px;width:43px;height:43px;margin-right:7px}nav{display:flex;gap:8px;flex-wrap:wrap}small,.muted{color:var(--muted)}.notice{font-size:13px;background:var(--soft);border-radius:10px;padding:10px 14px}.hero{padding:clamp(24px,5vw,60px);border-radius:28px;background:var(--soft);display:grid;grid-template-columns:1.35fr .85fr;gap:28px;align-items:center;margin:18px 0 30px}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;font-weight:750;color:var(--brand)}h1{font-size:clamp(34px,5vw,60px);line-height:1.08;letter-spacing:-2px;margin:12px 0 16px}h2{font-size:25px;letter-spacing:-.6px;margin:28px 0 12px}p{margin:0 0 14px}.art{display:grid;grid-template-columns:1fr 1fr;gap:10px;transform:rotate(-3deg)}.art div{background:var(--card);border-radius:25px;min-height:100px;display:grid;place-items:center;font-size:50px;box-shadow:0 10px 30px #00000009}.art div:nth-child(2),.art div:nth-child(3){background:var(--accent)}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;background:whit ellinen; kalenteria ei ole kytketty."}};

let lang="fi",chosen=null;try{const saved=localStorage.getItem("apukaveri-demo-language");if(["fi","ru","en"].includes(saved))lang=saved}catch{}const $=id=>document.getElementById(id),t=k=>translations[lang][k],label=c=>c[lang==="ru"?2:lang==="fi"?3:4],money=n=>new Intl.NumberFormat(lang==="ru"?"ru-FI":lang==="fi"?"fi-FI":"en-FI",{style:"currency",currency:"EUR"}).format(n);
// Reused from Pakkasukko src/validation.js (blob 4c347677fa2b1cca1de529dea9be26564cfa8388): calendar stamp validation.
function validStamp(s){
 if(typeof s!=='string'||!/^20\d{2}-(0[1-9]|1[0-2])-([0-2]\d|3[01])T([01]\d|2[0-3]):[0-5]\d$/.test(s))return false;
 const date=new Date(s+':00Z');return !Number.isNaN(date.getTime())&&date.toISOString().slice(0,16)===s;
}
function amounts(rate,h,fee){const cents=Math.round(rate*h*100),cut=Math.round(cents*fee/100);return [cents/100,cut/100,(cents-cut)/100]}
function fee(){const n=Number($("fee").value);return Number.isFinite(n)?Math.max(0,Math.min(30,n)):15}
function populate(el,options){const old=el.value;el.replaceChildren();options.forEach(([v,l])=>el.add(new Option(l,v)));if(options.some(a=>a[0]===old))el.value=old}
function today(){return new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Helsinki",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function render(){$("serverLink").textContent={fi:"Testipalvelu",ru:"Серверный стенд",en:"Server sandbox"}[lang];$("accountLink").textContent={fi:"Oma Apukaveri",ru:"Мой кабинет",en:"My account"}[lang];const d={fi:["Apua nyt","Kokeile kiireellistä pyyntöä, ilmoituksia ja maksutonta apua.","Avaa tilausdemo →"],ru:["Помощь сейчас","Испытайте срочную заявку, объявления и бесплатную помощь.","Открыть диспетчерскую →"],en:["Help now","Try urgent requests, listings and free help.","Open dispatch demo →"]}[lang];["dispatchTitle","dispatchText","dispatchLink"].forEach((id,i)=>$(id).textContent=d[i]);document.documentElement.lang=lang;document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));$("language").value=lang;$("style").textContent=t(document.body.classList.contains("modern")?"modern":"style");$("join").textContent=t("join");$("admin").textContent=t("admin");populate($("service"),[["",t("all")],...cats.map(c=>[c[0],label(c)])]);populate($("city"),[["",t("allCities")],...["Kitee","Joensuu","Porvoo"].map(c=>[c,c])]);populate($("providerService"),cats.map(c=>[c[0],label(c)]));renderCatalog();updateFee()}
function filtered(service,city){return profiles.filter(p=>(!service||p[2]===service)&&(!city||p[1]===city))}
function renderCatalog(){const service=$("service").value,city=$("city").value;let cs=$("categories");cs.replaceChildren();cats.forEach(c=>{let b=document.createElement("button");b.className="cat"+(service===c[0]?" active":"");b.setAttribute("aria-pressed",String(service===c[0]));let s=document.createElement("span");s.textContent=c[1];b.append(s,document.createTextNode(label(c)));b.onclick=()=>{$("service").value=service===c[0]?"":c[0];renderCatalog()};cs.append(b)});const found=filtered(service,city);$("count").textContent=t("results")+found.length+" · "+t("dateNote");let root=$("catalog");root.replaceChildren();if(!found.length){root.textContent=t("none");return}found.forEach(p=>{const el=document.createElement("article");el.className="person";const c=cats.find(x=>x[0]===p[2]);el.innerHTML='<div class="avatar" aria-hidden="true">'+p[0][0]+'</div><h3>'+p[0]+'</h3><div class="muted">'+p[1]+' · '+p[4]+'</div><span class="pill">'+t("demoProfile")+'</span><p>'+label(c)+'</p><span class="price">'+money(p[3])+'</span> / '+(lang==="ru"?"ч":"h");let b=document.createElement("button");b.textContent=t("book");b.onclick=()=>openBooking(p);el.append(b);root.append(el)})}
function openBooking(p){chosen=p;$("selected").textContent=p[0]+" · "+p[1]+" · "+label(cats.find(c=>c[0]===p[2]));$("bookDate").min=today();$("bookDate").value=$("date").value||today();$("status").textContent="";updateBooking();$("booking").showModal()}
function updateBooking(){if(!chosen)return;const a=amounts(chosen[3],Number($("hours").value),fee());$("breakdown").replaceChildren();["gross","platform","net"].forEach((k,i)=>{let row=document.createElement("div");row.className="line"+(i===2?" total":"");let l=document.createElement("span"),r=document.createElement("strong");l.textContent=t(k);r.textContent=money(a[i]);row.append(l,r);$("breakdown").append(row)})}
function updateFee(){const a=amounts(40,1,fee());$("feePreview").textContent=t("feeExample")+money(a[1])+" / "+money(a[2]);updateBooking()}
$("date").min=today();$("language").onchange=()=>{lang=$("language").value;try{localStorage.setItem("apukaveri-demo-language",lang)}catch{}render()};$("style").onclick=()=>{document.body.classList.toggle("modern");render()};$("service").onchange=renderCatalog;$("city").onchange=renderCatalog;$("find").onclick=()=>{renderCatalog();$("catalogTitle").scrollIntoView({behavior:"smooth"});$("catalogTitle").focus({preventScroll:true})};$("browse").onclick=()=>$("service").focus();$("join").onclick=()=>{$("provider").classList.toggle("hidden");$("provider").scrollIntoView()};$("heroJoin").onclick=()=>{$("provider").classList.remove("hidden");$("provider").scrollIntoView({behavior:"smooth"})};$("admin").onclick=()=>{$("adminPanel").classList.toggle("hidden");$("adminPanel").scrollIntoView()};$("fee").oninput=updateFee;$("hours").onchange=()=>{$("status").textContent="";updateBooking()};$("close").onclick=()=>$("booking").close();$("bookingForm").onsubmit=e=>{e.preventDefault();const d=$("bookDate").value,tm=$("bookTime").value;const now=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Helsinki",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date());$("status").textContent=!validStamp(d+"T"+tm)||d<today()||(d===today()&&tm<now)?t("invalid"):t("done")};$("providerDemo").onclick=()=>{$("providerStatus").textContent=$("providerRate").checkValidity()?t("providerDone"):t("invalid")};render();
