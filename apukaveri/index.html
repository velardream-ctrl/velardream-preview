<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Apukaveri</title><style>
*{box-sizing:border-box}body{--ink:#243c35;--muted:#5f6e66;--brand:#176a54;--bg:#f6f8f2;--soft:#e3efdf;--card:#fff;--accent:#f6d9ac;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}body.modern{--ink:#142b45;--muted:#536881;--brand:#285eb2;--bg:#f0f5ff;--soft:#dfeaff;--accent:#d5e4ff}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;background:var(--brand);color:white;font-weight:650}button.secondary{background:var(--soft);color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #bf7620;outline-offset:3px}header,main,footer{max-width:1180px;margin:auto;padding:18px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.logo{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:850;font-size:25px;color:var(--brand);letter-spacing:-1px}.logo span{display:inline-grid;place-items:center;background:var(--soft);border-radius:13px;width:43px;height:43px;margin-right:7px}nav{display:flex;gap:8px;flex-wrap:wrap}small,.muted{color:var(--muted)}.notice{font-size:13px;background:var(--soft);border-radius:10px;padding:10px 14px}.hero{padding:clamp(24px,5vw,60px);border-radius:28px;background:var(--soft);display:grid;grid-template-columns:1.35fr .85fr;gap:28px;align-items:center;margin:18px 0 30px}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;font-weight:750;color:var(--brand)}h1{font-size:clamp(34px,5vw,60px);line-height:1.08;letter-spacing:-2px;margin:12px 0 16px}h2{font-size:25px;letter-spacing:-.6px;margin:28px 0 12px}p{margin:0 0 14px}.art{display:grid;grid-template-columns:1fr 1fr;gap:10px;transform:rotate(-3deg)}.art div{background:var(--card);border-radius:25px;min-height:100px;display:grid;place-items:center;font-size:50px;box-shadow:0 10px 30px #00000009}.art div:nth-child(2),.art div:nth-child(3){background:var(--accent)}.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr auto;gap:10px;background:white;padding:14px;border-radius:16px;margin-top:22px}.field{display:grid;gap:5px;font-size:13px;font-weight:650}input,select{min-width:0;width:100%;border:1px solid #becdc5;border-radius:10px;padding:10px;background:white;color:#243c35}.filters button{align-self:end}.categories{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.cat{background:white;color:var(--ink);text-align:left;min-height:114px;padding:14px;border:2px solid transparent;box-shadow:0 3px 16px #00000005}.cat.active{border-color:var(--brand);background:var(--soft)}.cat span{display:block;font-size:28px;margin-bottom:5px}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.person,.panel{background:var(--card);border-radius:20px;padding:20px;border:1px solid #dfe7df}.avatar{width:56px;height:56px;display:grid;place-items:center;background:var(--soft);border-radius:50%;font-size:26px;color:var(--brand);font-weight:750}.person h3{margin:12px 0 3px;font-size:20px}.pill{display:inline-block;background:var(--soft);color:var(--brand);font-size:12px;font-weight:650;padding:4px 8px;border-radius:7px;margin:6px 0}.person button{width:100%;margin-top:12px}.price{font-size:25px;font-weight:750;color:var(--brand)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.steps strong{display:block;color:var(--brand);font-size:18px;margin-bottom:8px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}dialog{border:0;border-radius:20px;width:min(500px,calc(100% - 30px));padding:24px;color:var(--ink);box-shadow:0 10px 60px #0003}dialog::backdrop{background:#122522aa}dialog h2{margin:0 0 12px}dialog .field{margin:12px 0}.line{display:flex;justify-content:space-between;gap:10px;margin:8px 0}.total{border-top:1px solid #dce5de;padding-top:10px;font-weight:750}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}footer{font-size:13px;color:var(--muted)}@media(max-width:800px){.hero{grid-template-columns:1fr}.art{display:none}.categories{grid-template-columns:repeat(3,1fr)}.catalog{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr}.split{grid-template-columns:1fr}}@media(max-width:480px){header,main,footer{padding:12px 14px}.hero{padding:22px;border-radius:20px}.categories{grid-template-columns:repeat(2,1fr)}.catalog{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.logo{font-size:22px}nav button{padding:9px;font-size:13px}h1{letter-spacing:-1px}}
header nav{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;white-space:nowrap}
#style{width:7.5rem;min-height:42px;padding-inline:6px}
#language{min-height:42px;padding:6px;font-size:.875rem}
.account-link{color:var(--brand);font-weight:700}
@media(max-width:480px){
  header{gap:6px;flex-wrap:nowrap;justify-content:space-between;padding-inline:12px}
  header .logo{flex:none;white-space:nowrap}
  header nav{gap:4px}
  #style{width:4.5rem;padding-inline:4px}
  #language{padding-inline:4px}
}
@media(max-width:350px){
  header{gap:3px;padding-inline:6px}
  #style{width:4.25rem}
}
</style>
<link rel="icon" href="logo.svg"><link rel="apple-touch-icon" href="icon192.png"></head>
<body>
<header>
  <a class="logo" href="/"><img src="logo.svg" alt="" width="40" height="40">Apukaveri</a>
  <nav>
    <select id="language" aria-label="Language" style="width:auto">
      <option value="fi">Suomi</option><option value="en">English</option><option value="ru">Русский</option>
    </select>
    <button class="secondary" id="style" type="button"></button>
  </nav>
</header>
<main>
  <section class="hero">
    <div><h1 data-t="headline"></h1><p data-t="intro"></p></div>
    <div class="art" aria-hidden="true"><div>🧸</div><div>🐕</div><div>🛍️</div><div>🌱</div></div>
  </section>
  <p class="notice" data-t="status"></p>
  <p class="muted" data-t="intermediary"></p>
  <p><a class="account-link" href="/account.html" data-t="account"></a></p>
  <p id="serverLink" hidden><a class="account-link" href="/sandbox.html" data-t="sandbox"></a></p>
  <div class="filters" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))">
    <label class="field"><span data-t="service"></span><select id="service"></select></label>
    <label class="field"><span data-t="city"></span><select id="city"></select></label>
  </div>
  <h2 id="catalogTitle" tabindex="-1" data-t="catalog"></h2><p id="emptyCatalog" class="panel muted" data-t="empty"></p><article class="panel" id="ownProfile" hidden></article>
  <h2 data-t="categories"></h2><div id="categories" class="categories"></div>
</main>
<script src="/helper-profile.js"></script><script type="module">
import { serviceCategories as cats } from "./service-categories.mjs";
import { finnishCities } from "./finnish-cities.mjs";

const translations = {
  fi: {
    headline: "Apua lähellä, kun sitä tarvitset.", intro: "Apukaveri auttaa löytämään apua arjen askareisiin.",
    categories: "Mihin tarvitset apua?", service: "Palvelu", all: "Kaikki palvelut", city: "Kaupunki", allCities: "Kaikki kaupungit",
    catalog: "Apukaverit", empty: "Julkaistuja auttajaprofiileja ei vielä ole.",
    own: "Oma profiili", preview: "Esikatselu tässä selaimessa", noMatch: "Oma profiilisi ei vastaa valittuja suodattimia.",
    status: "Valmistelemme palvelun avaamista. Rekisteröinti ja varaukset avataan myöhemmin.",
    intermediary: "Apukaveri on välitysalusta. Työn tekee valitsemasi tekijä.",
    warm: "Lämmin", blue: "Sininen", palette: "Vaihda väripalettia", sandbox: "Palvelintesti", account: "Oma Apukaveri",
  },
  ru: {
    headline: "Помощь рядом, когда она нужна.", intro: "Apukaveri помогает найти поддержку в повседневных делах.",
    categories: "Чем вам помочь?", service: "Услуга", all: "Все услуги", city: "Город", allCities: "Все города",
    catalog: "Каталог помощников", empty: "Опубликованных анкет помощников пока нет.",
    own: "Моя анкета", preview: "Предпросмотр в этом браузере", noMatch: "Ваша анкета не подходит под выбранные фильтры.",
    status: "Готовим сайт к запуску. Регистрация и заявки откроются позже.",
    intermediary: "Apukaveri — платформа-посредник. Работу выполняет выбранный вами исполнитель.",
    warm: "Тёплая", blue: "Синяя", palette: "Переключить цветовую тему", sandbox: "Серверный стенд", account: "Личный кабинет",
  },
  en: {
    headline: "Help nearby, when you need it.", intro: "Apukaveri helps you find support with everyday tasks.",
    categories: "What do you need help with?", service: "Service", all: "All services", city: "City", allCities: "All cities",
    catalog: "Find a helper", empty: "No helper profiles have been published yet.",
    own: "My profile", preview: "Preview in this browser", noMatch: "Your profile does not match the selected filters.",
    status: "We are preparing to launch. Registration and bookings will open later.",
    intermediary: "Apukaveri is an intermediary platform. Your chosen helper performs the work.",
    warm: "Warm", blue: "Blue", palette: "Switch colour theme", sandbox: "Server sandbox", account: "My account",
  },
};
const el = (id) => document.getElementById(id);
let lang = "fi";
try {
  const saved = localStorage.getItem("apukaveri-demo-language");
  if (Object.hasOwn(translations, saved)) lang = saved;
} catch {}

function renderOwnProfile() {
  const t = translations[lang];
  const profile = helperProfile.readAccount();
  const allServices = helperProfile.read();
  const service = el("service").value;
  const place = finnishCities.find(city => city.city === profile.city);
  const city = el("city").value;
  const services = allServices.filter(item => !service || item.service === service);
  const matches = services.length > 0 && (!city || place?.city === city);
  const card = el("ownProfile");
  const empty = el("emptyCatalog");
  empty.hidden = matches;
  empty.textContent = allServices.length ? t.noMatch : t.empty;
  card.hidden = !matches;
  card.replaceChildren();
  if (!matches) return;

  const title = document.createElement("h3");
  title.textContent = profile.name || t.own;
  const badge = document.createElement("p");
  badge.className = "muted";
  badge.textContent = [t.preview, place?.[lang]].filter(Boolean).join(" · ");
  const list = document.createElement("ul");
  const money = new Intl.NumberFormat(lang, { style: "currency", currency: "EUR" });
  for (const item of services) {
    const row = document.createElement("li");
    row.textContent = item.labels[lang] + " · " + money.format(item.rate) + (lang === "ru" ? " / ч" : " / h");
    list.append(row);
  }
  const link = document.createElement("a");
  link.href = "/account.html";
  link.className = "account-link";
  link.textContent = t.account;
  card.append(title, badge, list, link);
}

function renderCategories() {
  const selected = el("service").value;
  const labelIndex = { ru: 2, fi: 3, en: 4 }[lang];
  el("categories").replaceChildren(...cats.map(([id, icon, ...labels]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = id === selected ? "cat active" : "cat";
    button.setAttribute("aria-pressed", String(id === selected));
    const mark = document.createElement("span");
    mark.setAttribute("aria-hidden", "true");
    mark.textContent = icon;
    button.append(mark, labels[labelIndex - 2]);
    button.onclick = () => {
      el("service").value = id === selected ? "" : id;
      renderCategories();
      el("catalogTitle").focus();
    };
    return button;
  }));
  renderOwnProfile();
}

function render() {
  const t = translations[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((node) => {
    node.textContent = t[node.dataset.t];
  });
  if (["localhost", "127.0.0.1"].includes(location.hostname)) {
    el("serverLink").hidden = false;
  }
  el("language").value = lang;
  const theme = el("style");
  theme.textContent = document.body.classList.contains("modern") ? t.blue : t.warm;
  theme.setAttribute("aria-label", t.palette + " · " + theme.textContent);
  const service = el("service");
  const selected = service.value;
  const labelIndex = { ru: 2, fi: 3, en: 4 }[lang];
  service.replaceChildren(new Option(t.all, ""), ...cats.map((category) =>
    new Option(category[1] + " " + category[labelIndex], category[0]),
  ));
  service.value = selected;
  const city = el("city");
  const selectedCity = city.value;
  const cities = [...finnishCities].sort((a, b) => a[lang].localeCompare(b[lang], lang));
  city.replaceChildren(new Option(t.allCities, ""), ...cities.map(place =>
    new Option(place[lang], place.city),
  ));
  city.value = selectedCity;
  renderCategories();
}

el("language").onchange = () => {
  lang = el("language").value;
  try { localStorage.setItem("apukaveri-demo-language", lang); } catch {}
  render();
};
el("style").onclick = () => {
  document.body.classList.toggle("modern");
  render();
};
el("service").onchange = renderCategories;
el("city").onchange = renderOwnProfile;
window.addEventListener("pageshow", renderOwnProfile);
window.addEventListener("storage", renderOwnProfile);
render();
</script>
</body></html>
