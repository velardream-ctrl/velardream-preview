<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Apukaveri · Dispatch demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:#233e32;font:16px/1.5 system-ui,sans-serif}main{max-width:860px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#17684e}h1{font-size:clamp(28px,5vw,44px);line-height:1.1}h2{font-size:21px}section{background:white;border:1px solid #dbe6dc;border-radius:20px;padding:20px;margin:16px 0}label{display:grid;gap:5px;margin:10px 0;font-weight:600}select,button{font:inherit;border-radius:10px;padding:10px;border:1px solid #a7bcad;background:white;color:#233e32}button{background:#17684e;color:white;border:0;font-weight:650;cursor:pointer}button:disabled{background:#dce5de;color:#566b5e;cursor:default}button.alt{background:#e3efe3;color:#233e32}button:focus-visible,select:focus-visible{outline:3px solid #bc7826;outline-offset:2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.person{border:1px solid #dbe6dc;padding:12px;border-radius:12px}.person button{width:100%}.notice{background:#fff0d9;padding:12px;border-radius:12px}.status{background:#e3efe3;padding:14px;border-radius:12px;white-space:pre-line}small{color:#53685c}@media(max-width:540px){main{padding:12px}.grid{grid-template-columns:1fr}section{padding:15px}}
</style></head><body><main><header><a href="index.html"><b>♥ Apukaveri</b></a><select id="lang" aria-label="Language"><option value="fi">Suomi</option><option value="ru">Русский</option><option value="en">English</option></select></header><h1 id="title"></h1><p class="notice" id="notice"></p><section><h2 id="customer"></h2><label><span id="modeLabel"></span><select id="mode"></select></label><label><span id="serviceLabel"></span><select id="service"></select></label><label><span id="payLabel"></span><select id="pay"></select></label><label><span id="targetLabel"></span><select id="target"></select></label><button id="send"></button><button id="reset" class="alt"></button><p id="customerStatus" class="status" role="status"></p></section><section><h2 id="helpers"></h2><p id="helperIntro"></p><div class="grid" id="cards"></div></section><section><h2 id="listingTitle"></h2><p id="listingDesc"></p><div class="grid"><div class="person"><b>Kitee → Joensuu</b><p id="ride"></p></div><div class="person"><b>Joensuu → Kitee</b><p id="errand"></p></div></div></section><small id="footer"></small></main><script>
"use strict";
const tr={fi:{title:"Apua nyt – tilausdemo",notice:"Vain simulaatio. Ei oikeita käyttäjiä, varauksia, maksuja tai push-ilmoituksia.",customer:"Asiakkaan näkymä",modeLabel:"Tilaustapa",serviceLabel:"Palvelu",payLabel:"Maksutapa",targetLabel:"Kenelle pyyntö?",send:"Lähetä demopyyntö",reset:"Aloita uudelleen",helpers:"Tekijöiden näkymä",helperIntro:"Kokeile hyväksymistä eri tekijöillä. Kaikki henkilöt ovat kuvitteellisia.",listingTitle:"Ilmoitukset",listingDesc:"Esimerkkejä tulevista ilmoituksista. Ei oikeita tilauksia.",ride:"Kimppakyyti • kulujen jako (suunnitteilla)",errand:"Ostoksen nouto • palkkio sovitaan",footer:"RUN-003 • paikallinen simulaatio • palvelin ja ilmoitukset vielä puuttuvat",modes:["Kiireellinen","Suunniteltu","Ilmoitus"],services:["Lastenhoito","Koiran ulkoilutus","Asiointiapu","Naapuriapu"],pays:["Maksuton","Maksullinen"],targets:["Kaikki sopivat","Vain suosikit","Aino"],available:"Saatavilla",favorite:"Suosikki",accept:"Hyväksy",waiting:"Pyyntö lähetetty (demo).",idle:"Ei aktiivista pyyntöä.",won:"Tilaus varattu tekijälle: ",closed:"Pyyntö suljettu muilta.",notified:"Uusi demopyyntö",notEligible:"Ei kohderyhmässä / ei saatavilla",noMatches:"Ei sopivia tekijöitä.",listing:"Ilmoitus luotu (demo).",planned:"Suunniteltu pyyntö luotu (demo)."},ru:{title:"Помощь сейчас — демо заказов",notice:"Только симуляция. Нет настоящих пользователей, заказов, платежей или push-уведомлений.",customer:"Кабинет заказчика",modeLabel:"Способ заказа",serviceLabel:"Услуга",payLabel:"Вид оплаты",targetLabel:"Кому отправить?",send:"Отправить демо-заявку",reset:"Начать заново",helpers:"Кабинеты исполнителей",helperIntro:"Попробуйте принять заказ от лица разных помощников. Все люди вымышлены.",listingTitle:"Объявления",listingDesc:"Примеры будущих объявлений. Не реальные заказы.",ride:"Попутчики • разделение расходов (план)",errand:"Забрать покупку • вознаграждение по договорённости",footer:"RUN-003 • локальная симуляция • сервер и уведомления пока не подключены",modes:["Срочная помощь","Плановая заявка","Объявление"],services:["Няня","Выгул собак","Покупки и поручения","Помощь соседям"],pays:["Бесплатно","Платно"],targets:["Всем подходящим","Только избранным","Aino"],available:"Доступен",favorite:"Избранный",accept:"Принять",waiting:"Заявка разослана (демо).",idle:"Нет активной заявки.",won:"Заказ закреплён за: ",closed:"Для остальных заявка закрыта.",notified:"Новая демо-заявка",notEligible:"Не подходит / недоступен",noMatches:"Нет подходящих исполнителей.",listing:"Объявление создано (демо).",planned:"Плановая заявка создана (демо)."},en:{title:"Help now – dispatch demo",notice:"Simulation only. No real users, bookings, payments or push notifications.",customer:"Customer view",modeLabel:"Request type",serviceLabel:"Service",payLabel:"Payment type",targetLabel:"Send to whom?",send:"Send demo request",reset:"Start again",helpers:"Helper views",helperIntro:"Try accepting as different fictional helpers.",listingTitle:"Listings",listingDesc:"Future listing examples. Not real orders.",ride:"Carpool • cost sharing (planned)",errand:"Collect a purchase • reward by agreement",footer:"RUN-003 • local simulation • server and notifications not connected",modes:["Urgent","Scheduled","Listing"],services:["Babysitting","Dog walking","Shopping & errands","Neighbourly help"],pays:["Free","Paid"],targets:["All eligible","Favourites only","Aino"],available:"Available",favorite:"Favourite",accept:"Accept",waiting:"Request sent (demo).",idle:"No active request.",won:"Assigned to: ",closed:"Closed for other helpers.",notified:"New demo request",notEligible:"Not eligible / unavailable",noMatches:"No eligible helpers.",listing:"Listing created (demo).",planned:"Scheduled request created (demo)."}};
const people=[{id:"Aino",favorite:true,available:true,services:[0,3],pay:[0,1]},{id:"Sofia",favorite:true,available:true,services:[0,2],pay:[1]},{id:"Mika",favorite:false,available:true,services:[1,2,3],pay:[0,1]},{id:"Elli",favorite:false,available:true,services:[0,1,2],pay:[1]},{id:"Nina",favorite:false,available:false,services:[0],pay:[1]}];
const eligible=(p,r)=>p.available&&p.services.includes(r.service)&&p.pay.includes(r.pay)&&(r.target===0||(r.target===1&&p.favorite)||(r.target===2&&p.id==="Aino"));
function claim(r,p){if(!r||r.mode!==0||r.winner||!eligible(p,r))return false;r.winner=p.id;return true}
const $=id=>document.getElementById(id);let lang="fi",request=null;try{let v=localStorage.getItem("apukaveri-demo-language");if(tr[v])lang=v}catch{}const t=k=>tr[lang][k];
function select(id,key){let el=$(id),old=el.value;el.replaceChildren();t(key).forEach((v,i)=>el.add(new Option(v,String(i))));if(old!=="")el.value=old}
function render(){document.documentElement.lang=lang;$("lang").value=lang;["title","notice","customer","modeLabel","serviceLabel","payLabel","targetLabel","send","reset","helpers","helperIntro","listingTitle","listingDesc","ride","errand","footer"].forEach(k=>$(k).textContent=t(k));select("mode","modes");select("service","services");select("pay","pays");select("target","targets");show()}
function show(){const root=$("cards");root.replaceChildren();let status=t("idle");if(request)status=request.winner?t("won")+request.winner+"\n"+t("closed"):request.mode===2?t("listing"):request.mode===1?t("planned"):people.some(p=>eligible(p,request))?t("waiting"):t("noMatches");$("customerStatus").textContent=status;$("send").disabled=!!request;["mode","service","pay","target"].forEach(id=>$(id).disabled=!!request);people.forEach(p=>{const card=document.createElement("article");card.className="person";const b=document.createElement("b");b.textContent=p.id+(p.favorite?" ★":"");const detail=document.createElement("p");const pending=request&&request.mode===0&&!request.winner&&eligible(p,request);detail.textContent=pending?t("notified"):request&&request.winner?t("closed"):request?t("notEligible"):p.available?t("available"):t("notEligible");const btn=document.createElement("button");btn.textContent=t("accept");btn.disabled=!pending;btn.onclick=()=>{claim(request,p);show()};card.append(b,detail,btn);root.append(card)})}
$("lang").onchange=()=>{lang=$("lang").value;try{localStorage.setItem("apukaveri-demo-language",lang)}catch{}render()};$("send").onclick=()=>{request={mode:Number($("mode").value),service:Number($("service").value),pay:Number($("pay").value),target:Number($("target").value),winner:null};show()};$("reset").onclick=()=>{request=null;show()};render();
</script></body></html>
