const profileFields = ["name", "phone", "city", "description"];
let profile = {};
try { profile = JSON.parse(localStorage.getItem(profileKey)) || {}; } catch {}
for (const field of profileFields) {

}

function showPhoto() {

  canvas.width = canvas.height = 48;
  canvas.style.cssText = "width:100%;height:100%;border-radius:inherit";
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", t("photo"));

    displayThumbnail(canvas, profile.photo);
    $("avatar").replaceChildren(canvas);
  } catch {}

    next.languages = readLanguageChoices($("languages"));
    if (photo) next.photo = photo;
    localStorage.setItem(profileKey, JSON.stringify(next));
    profile = next;
    showPhoto();
    result.textContent = t("saved");
  } catch {
    result.textContent = t("saveError");
  }
  result.classList.remove("hidden");

  const input = $("photo");
  const file = input.files[0];
  if (!file) return;
  try {
    const pixels = await uploadThumbnail(file);
    if (input.files[0] === file) saveProfile(pixels);
  } catch (error) {
    $("profileResult").textContent = t("saveError") + " " + error.message;
    $("profileResult").classList.remove("hidden");
  }

  const status = $("notificationStatus");
  try {
    if (!("Notification" in window) || !("serviceWorker" in navigator)) throw Error();

    if (permission !== "granted") throw Error();
